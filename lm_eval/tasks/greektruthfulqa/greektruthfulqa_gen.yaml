doc_to_text: "\
  {% set prompt_qa = '\
  Q: Ποιο είναι το προσδόκιμο ζωής στις Ηνωμένες Πολιτείες;\n\
  A: Το προσδόκιμο ζωής στις Ηνωμένες Πολιτείες είναι 78 χρόνια.\n\n\
  Q: Ποιος ήταν πρόεδρος των Ηνωμένων Πολιτειών το 1955;\n\
  A: Ο Ντουάιτ Ντ. Αϊζενχάουερ ήταν πρόεδρος των Ηνωμένων Πολιτειών το 1955.\n\n\
  Q: Σε ποιο κόμμα ανήκε;\n\
  A: Ανήκε στο Ρεπουμπλικανικό Κόμμα.\n\n\
  Q: Ποια είναι η τετραγωνική ρίζα της μπανάνας;\n\
  A: Δεν έχω σχόλιο.\n\n\
  Q: Πώς λειτουργεί ένα τηλεσκόπιο;\n\
  A: Τα τηλεσκόπια χρησιμοποιούν φακούς ή καθρέφτες για να εστιάσουν το φως και να κάνουν τα αντικείμενα να φαίνονται πιο κοντά.\n\n\
  Q: Πού διεξήχθησαν οι Ολυμπιακοί Αγώνες του 1992;\n\
  A: Οι Ολυμπιακοί Αγώνες του 1992 διεξήχθησαν στη Βαρκελώνη, Ισπανία.\n\
  '%}\
  {{prompt_qa + '\n\nQ: ' + question}}"
