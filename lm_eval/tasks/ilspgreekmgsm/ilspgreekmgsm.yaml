task: ilspgreekmgsm
dataset_path: ilsp/mgsm_greek
dataset_name: null
output_type: generate_until
training_split: train
test_split: test
doc_to_text: '{% if answer %}{{question+"\nΑπάντηση βήμα προς βήμα:"}}{% else %}{{"Ερώτηση: "+question+"\nΑπάντηση βήμα προς βήμα:"}}{% endif %}'
doc_to_target: '{% if answer %}{{answer[25:]}}{% else %}{{answer_number|string}}{% endif %}'
target_delimiter: " "
generation_kwargs:
  until:
    - "\n\n"
    - "\n"
  do_sample: false
  temperature: 0.0
metric_list:
  - metric: exact_match
    aggregation: mean
    higher_is_better: true
    ignore_case: true
    ignore_punctuation: true
filter_list:
  - name: "strict-match"
    filter:
      - function: "regex"
        regex_pattern: "Η απάντηση είναι (\\-?[0-9\\.\\,]+)"
      - function: "take_first"
  - name: "flexible-extract"
    filter:
      - function: "regex"
        group_select: -1
        regex_pattern: "(-?[$0-9.,]{2,})|(-?[0-9]+)"
      - function: "take_first"
metadata:
  version: 1.0
